services:
  game:
    build: .
    ports:
      - "${GAME_BIND:-127.0.0.1}:${GAME_PORT:-8080}:4173"
    environment:
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-}"
    volumes:
      - daily-songs:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 20s

volumes:
  daily-songs:
